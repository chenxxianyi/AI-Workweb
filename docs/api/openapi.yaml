# =============================================================================
# AI 编程工作台 API —— OpenAPI 3.1.0 契约「草案」（F03 交付物）
#
# 权威来源：全栈开发任务/数据库与接口设计.md（V2.0 / 2026-11-03）
#           全栈开发任务/需求与验收矩阵.md「统一业务规则」
# 本文件是 F03 草案；实体、约束与错误语义以《数据库与接口设计》为准。
# 与设计文档不一致或需要补充确认之处，已在对应 description 及 F03 交付说明中列出，
# 不在本文件内静默修改设计文档。
# 生成前端类型前必须通过 CI 契约检查（OpenAPI lint + 破坏性差异检查 + 契约测试）；
# CI 未通过不得据此生成客户端或改动调用方。
# =============================================================================
openapi: 3.1.0
x-contract-status: draft
x-contract-owner: F03
x-source-of-truth: 全栈开发任务/数据库与接口设计.md
info:
  title: AI 编程工作台 API
  version: 0.1.0
  summary: F03 OpenAPI 3.1 契约草案（实体与错误以《数据库与接口设计》为准）
  description: |
    本文件是「AI 编程工作台」全栈项目的 API 契约草案（F03 交付物），
    实体、约束与错误语义以《全栈开发任务/数据库与接口设计.md》（V2.0）为准，
    校验阈值以《需求与验收矩阵》「统一业务规则」为准。

    认证与会话：全部端点走同源 Cookie 会话（securityScheme sessionCookie，cookie 名 sfs_session，HttpOnly + Secure + SameSite=Lax），
    不启用任意 CORS；开发期跨端口由 Vite 代理 /api 解决。所有写操作需带 X-CSRF-Token 头（取自 GET /auth/csrf，并与当前会话绑定），
    登录、退出、改密均轮换会话。服务器 CLI bootstrap-owner 用于幂等创建首个账号与空间，不是公开 HTTP 接口，故不出现在本文件 paths 中。

    空间边界：业务端点一律为 /workspaces/{workspaceId}/...。服务端先由会话识别 user，再校验 workspace_members，
    最后才执行该空间内查询；非成员一律 404（不区分「不存在」与「无权」，避免探测其他空间对象）。
    禁止只按对象 id 查询后依赖前端隐藏。

    条件写 If-Match：GET 详情返回 ETag（带引号的十进制 version）且实体响应含 version。PATCH/DELETE/恢复必须带 If-Match，
    缺失返回 428，过期返回 412，412 响应体给出可授权查看的 currentVersion。前端不得自行猜版本，也不能先读后无条件 UPDATE。

    幂等 Idempotency-Key：创建类与可重试动作必须带 Idempotency-Key；幂等范围 = 账号 + 空间 + 动作 + key，
    请求 hash 排除可变 CSRF 头但包含业务体；同 key 不同请求体返回 409；结果默认保留 7 天，指定离线事件同样 7 天。
    结果未知的传输任务按 jobId 轮询，不得用新 key 重发。

    游标分页：limit 默认 20、最大 100；cursor 为不透明串，绑定空间、排序与筛选指纹，改变筛选后必须丢弃旧 cursor；
    大表正常滚动不使用 offset；游标分页不承诺跨多次请求的一致快照（导出另用一致性快照）。

    时间与日期：时间戳为服务器 UTC ISO8601 且带 Z；业务日期为 YYYY-MM-DD（format date），按空间时区解释，
    不当作 UTC 时刻。今日、逾期、周起点（周一）、月度统计均按 workspace.timezone（默认 Asia/Shanghai，仅 Owner 可改）。

    请求体限制：普通 JSON 默认 128KiB；业务正文 octet_length(body) ≤ 20480；传输文件流式落内部临时卷，默认 ≤ 512MiB、≤ 25 万条实体。
    超限返回 413 并明确说明，不截断内容。禁止客户端提交 createdBy、role、workspaceId 等系统字段。

    错误模型：失败一律 { error: { code, message, fieldErrors? }, requestId }，见 ErrorResponse。
    状态码：400 语法错误；401 未登录/会话过期/已吊销；403 已确认成员但角色无权，或 CSRF/来源校验失败；
    404 不存在或不属于可访问空间；409 幂等键与体不一致、业务冲突、预览计划过期；
    412 If-Match 版本过期；413 超限；422 字段或业务校验失败；428 缺少 If-Match；429 限流；503 依赖不可用。

    读写约束：GET 不产生业务副作用（last_seen 等内部节流维护不影响业务 version）。
    统一成功响应为 { data, meta?: { nextCursor, hasMore }, requestId }；204 表示无响应体。
  license:
    name: 内部项目（个人或小团队私有部署）
servers:
  - url: /api/v1
    description: 同源部署；生产经反向代理，开发经 Vite 代理，均不使用跨域 CORS。
security:
  - sessionCookie: []
tags:
  - name: 认证
    description: CSRF、登录退出、当前用户、密码与会话
  - name: 恢复与邀请
    description: 一次性恢复令牌与邀请接受
  - name: 空间
    description: 空间查询与创建（创建者成为 owner）
  - name: 成员
    description: 成员列表、角色变更与移除（最后 owner 保护）
  - name: 邀请
    description: 邀请签发、列表与撤销（列表不返回 token）
  - name: 今日
    description: 服务端统一业务日期的紧急项与计数聚合
  - name: 项目
    description: 项目 CRUD、概览与进度
  - name: 任务
    description: 任务 CRUD、昨日顺延与沉淀入口
  - name: 日志
    description: 开发日志（按业务日与创建时间分页）
  - name: 知识
    description: 知识条目、修订、使用统计与标签筛选
  - name: 标签与搜索
    description: 标签列表与空间内搜索
  - name: 台账
    description: AI 使用台账记录
  - name: 统计
    description: 月度与近 8 周聚合
  - name: 传输
    description: 导出、导入预览/确认与作业状态、下载
  - name: 回收站
    description: 软删除对象列表、恢复与硬删除
  - name: 运维
    description: 空间清空与健康检查
  - name: 偏好
    description: 个人偏好与空间内个人偏好
  - name: 审计
    description: 空间审计事件（owner）
paths:
  /auth/csrf:
    get:
      tags: [认证]
      operationId: getCsrfToken
      summary: 获取 CSRF 令牌
      description: 同源 GET。返回绑定当前会话的 CSRF 令牌；写操作必须通过 X-CSRF-Token 回传。登录前也可调用，登录同样校验 CSRF 与来源。无业务副作用。
      security: []
      responses:
        '200':
          description: CSRF 令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfEnvelope' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/login:
    post:
      tags: [认证]
      operationId: login
      summary: 登录（轮换会话）
      description: 校验来源与 CSRF，成功后轮换会话并返回新的 csrfToken 与本人空间成员关系。失败不泄露账号是否存在（统一 401 INVALID_CREDENTIALS）。登录不是资源创建；若携带 Idempotency-Key，仅用于抑制重复尝试的审计与限流计数，不会复用先前的会话响应或 token。
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/logout:
    post:
      tags: [认证]
      operationId: logout
      summary: 退出当前会话
      description: 吊销当前会话并清 cookie。天然幂等；Idempotency-Key 可选，用于客户端重试时避免重复审计噪声。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '204':
          description: 已退出，无响应体
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/me:
    get:
      tags: [认证]
      operationId: getCurrentUser
      summary: 当前用户与所属空间
      description: 返回本人账号、空间成员关系与个人偏好。不含 password_hash、token 或内部路径。
      responses:
        '200':
          description: 当前用户
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/password:
    patch:
      tags: [认证]
      operationId: changePassword
      summary: 修改密码
      description: 必须提供当前密码；使用恢复令牌时走 /auth/recovery/complete。成功后按策略吊销其他会话并返回吊销数量。账号无 version 字段，故不使用 If-Match，而以当前密码/令牌做重认证；Idempotency-Key 可选。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '200':
          description: 密码已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionRevocationEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/sessions:
    get:
      tags: [认证]
      operationId: listSessions
      summary: 本人会话列表
      description: 只返回本人会话；不含 token 或 token 哈希。
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/sessions/{id}:
    delete:
      tags: [认证]
      operationId: revokeSession
      summary: 吊销指定本人会话
      description: 只能吊销本人会话。重复吊销返回 204（天然幂等）；会话无 version 字段，使用 Idempotency-Key 而非 If-Match。
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '204':
          description: 已吊销，无响应体
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/recovery/complete:
    post:
      tags: [恢复与邀请]
      operationId: completeRecovery
      summary: 用恢复令牌完成账号恢复
      description: 恢复令牌由服务器 CLI 签发，默认 30 分钟且一次性；令牌不入日志。成功后设置新密码并吊销相关会话。
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryCompleteRequest' }
      responses:
        '200':
          description: 恢复完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionRevocationEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 令牌已使用、已过期或已被撤销（不使用重放）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/invitations/accept:
    post:
      tags: [恢复与邀请]
      operationId: acceptInvitation
      summary: 接受空间邀请
      description: 邀请 token 一次性、默认 48 小时；已有用户只建立成员关系，不重设密码；新用户在此设置本人密码。成功后建立会话。
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationAcceptRequest' }
      responses:
        '200':
          description: 已加入空间
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 令牌已接受、已撤销或已过期；或邮箱已被其他账号占用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces:
    get:
      tags: [空间]
      operationId: listWorkspaces
      summary: 我的空间列表
      description: 只返回会话用户仍为有效成员的空间。
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: 空间列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [空间]
      operationId: createWorkspace
      summary: 创建空间（创建者成为 owner）
      description: 幂等创建；创建者自动成为 owner 并写入审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCreateRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 幂等键与请求体不一致，或同一用户空间名冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}:
    get:
      tags: [空间]
      operationId: getWorkspace
      summary: 空间详情
      description: 成员可见；返回 ETag 供后续 PATCH 使用。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: 空间详情
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [空间]
      operationId: updateWorkspace
      summary: 修改空间（owner）
      description: 仅 owner；改名或改时区需确认对日期统计的影响，未确认返回 422。时区变更写审计。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceUpdateRequest' }
      responses:
        '200':
          description: 已修改
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/members:
    get:
      tags: [成员]
      operationId: listMembers
      summary: 成员列表
      description: 成员可见；返回 role（owner/editor/viewer）与状态。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMemberListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/members/{userId}:
    patch:
      tags: [成员]
      operationId: updateMember
      summary: 修改成员角色（owner）
      description: 仅 owner。事务内锁成员集合，禁止并发移除/降级最后一位 owner（409 LAST_OWNER）。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceMemberUpdateRequest' }
      responses:
        '200':
          description: 已修改
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMemberEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 最后一位 owner 保护或成员状态冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [成员]
      operationId: removeMember
      summary: 移除成员（owner）
      description: 仅 owner；最后一位 owner 不可移除（409）；同时吊销或重校验其访问。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':

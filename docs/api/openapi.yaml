        entityId: { type: [string, 'null'], format: uuid }
        requestId: { type: [string, 'null'] }
        result: { type: string, enum: [success, failure] }
        summary: { type: string, maxLength: 1000, description: '脱敏摘要' }
        at: { $ref: '#/components/schemas/UtcTimestamp' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp', description: '等于 at' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp', description: '审计事件不可变，等于 at' }
    Preference:

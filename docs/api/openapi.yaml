      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImportPreviewRequest' }
      responses:
        '202':
          description: 已受理，进入校验
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferJobEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 幂等键冲突或同空间已有进行中的导入
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: 未知 schema 版本、文件结构不合法或条数超限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/imports/{jobId}/commit:
    post:
      tags: [传输]
      operationId: commitImport
      summary: 确认导入计划
      description: 仅 owner。必须回传 planHash，提交时重新验证 planHash 与触及实体的 version；计划过期或版本变化返回 409 PLAN_STALE（需重新预览）。同 job 业务只能提交一次，幂等键外再以 jobId 兜底。过期/取消的 job 不可提交。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/jobId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportCommitRequest' }
      responses:
        '202':
          description: 已排队执行合并
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferJobEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: PLAN_STALE、计划已提交/取消/过期或幂等键冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/transfers/{jobId}:
    get:
      tags: [传输]
      operationId: getTransferJob
      summary: 传输作业状态
      description: 创建者或 owner 可访问，且必须验证 job 属于该空间（不能猜 id 下载）。导入 job 在 preview_ready 后附带 preview。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: 作业状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferJobEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/transfers/{jobId}/download:
    get:
      tags: [传输]
      operationId: downloadTransfer
      summary: 下载导出文件
      description: 仅 succeeded 且未过期的导出 job；走认证 API 流式返回，不暴露内部文件目录与随机文件名。作业未完成或已过期返回 409。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: 文件流
          headers:
            Content-Disposition:
              description: attachment 文件名
              schema: { type: string }
            Content-Length:
              schema: { type: integer }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 作业未完成、已失败或已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/trash:
    get:
      tags: [回收站]
      operationId: listTrash
      summary: 回收站列表
      description: 仅 owner/editor；30 天保留期内可恢复。按 type 过滤，按 deletedAt DESC 稳定分页。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/trashTypeQuery'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: 回收站列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashItemListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/trash/{type}/{id}/restore:
    post:
      tags: [回收站]
      operationId: restoreTrashItem
      summary: 从回收站恢复
      description: owner。恢复不自动复活已删除父对象，必须确认链接目标仍在同空间且有效；只恢复仍然有效的关系。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/trashType'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashRestoreResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 父对象已删除或引用目标失效，需人工确认
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/trash/{type}/{id}:
    delete:
      tags: [回收站]
      operationId: purgeTrashItem
      summary: 彻底删除回收站对象
      description: owner。硬删除按外键规则执行：项目先置空子实体 projectId；条目先将台账 entryId 置空并删除修订/使用数据；写审计。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/trashType'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已彻底删除，无响应体
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 仍存在受保护引用，拒绝硬删
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/maintenance/clear:
    post:
      tags: [运维]
      operationId: clearWorkspaceData
      summary: 清空空间业务数据
      description: owner、二次确认、最近重新认证。事务内清空该空间业务与关联/统计，保留身份与成员，写审计；不删除 users 与其他空间数据。需回传 confirmName（等于空间名）与 backupAcknowledged，并携带空间当前 version 的 If-Match。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceClearRequest' }
      responses:
        '200':
          description: 已清空
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceClearResultEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 确认名称不匹配、未确认备份或幂等键冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /me/preferences:
    get:
      tags: [偏好]
      operationId: getMyPreferences
      summary: 本人偏好
      description: 只允许本人读取；返回 ETag 与 version。
      responses:
        '200':
          description: 偏好
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [偏好]
      operationId: updateMyPreferences
      summary: 修改本人偏好
      description: 条件写；defaultWorkspaceId 必须验证成员关系。主题变更跨设备同步。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferenceUpdateRequest' }
      responses:
        '200':
          description: 已修改
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenceEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/me/preferences:
    get:
      tags: [偏好]
      operationId: getWorkspacePreferences
      summary: 我在该空间的偏好
      description: 备份提醒等按用户空间维护，不能越权修改空间配置。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
      responses:
        '200':
          description: 空间内个人偏好
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspacePreferenceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [偏好]
      operationId: updateWorkspacePreferences
      summary: 修改我在该空间的偏好
      description: 条件写；只影响本人提示状态（如 tipShownAt、lastBusinessExportAt），不改空间配置。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspacePreferenceUpdateRequest' }
      responses:
        '200':
          description: 已修改
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspacePreferenceEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/audit-events:
    get:
      tags: [审计]
      operationId: listAuditEvents
      summary: 空间审计事件（owner）
      description: 仅 owner；脱敏，不返回 token 或整篇正文；按 at DESC、id 分页。
      parameters:
        - $ref: '#/components/parameters/workspaceId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/entityType'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: 审计事件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /health/live:
    get:
      tags: [运维]
      operationId: getLiveness
      summary: 存活探针
      description: 仅检查进程存活，不访问数据库；公开响应不泄露内部连接信息。
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthEnvelope' }
  /health/ready:
    get:
      tags: [运维]
      operationId: getReadiness
      summary: 就绪探针
      description: 检查数据库可用性；不可用时 503。响应不含连接串、堆栈或内部路径。
      security: []
      responses:
        '200':
          description: 就绪
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthEnvelope' }
        '503':
          description: 依赖不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthEnvelope' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sfs_session
      description: 同源 HttpOnly 会话 cookie，值为随机原始 token（库内只存哈希）；默认 Secure + SameSite=Lax，不启用任意 CORS。登录/改密轮换，退出/改密可吊销。
  headers:
    ETag:
      description: 实体当前版本的强 ETag，值为带引号的十进制 version，例如 "4"；用于 PATCH/DELETE 的 If-Match。
      schema: { type: string, pattern: '^"[0-9]+"$' }
  parameters:
    workspaceId:
      name: workspaceId
      in: path
      required: true
      description: 空间 ID。会话用户必须是该空间有效成员，否则 404（避免探测）。
      schema: { $ref: '#/components/schemas/Uuid' }
    id:
      name: id
      in: path
      required: true
      description: 实体 ID，语义由路径决定（项目/任务/知识/日志/台账/会话/邀请）。必须属于路径中的空间。
      schema: { $ref: '#/components/schemas/Uuid' }
    userId:
      name: userId
      in: path
      required: true
      description: 目标用户 ID；成员关系以 (workspaceId,userId) 唯一标识。
      schema: { $ref: '#/components/schemas/Uuid' }
    jobId:
      name: jobId
      in: path
      required: true
      description: 传输作业 ID；访问时校验 job 属于该空间且调用者为创建者或 owner。
      schema: { $ref: '#/components/schemas/Uuid' }
    trashType:
      name: type
      in: path
      required: true
      description: 回收站实体类型。
      schema: { type: string, enum: [project, task, entry, log, ledger] }
    limit:
      name: limit
      in: query
      required: false
      description: 每页条数，默认 20，最大 100；超过上限返回 422，不静默截断。
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    cursor:
      name: cursor
      in: query
      required: false
      description: 不透明游标，绑定空间、排序与筛选指纹；改变筛选后必须丢弃旧游标。不接受 offset 语义。
      schema: { type: string, maxLength: 512 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 实体当前 version（ETag，形如 "4"）。缺失返回 428，不匹配返回 412；前端不得自行猜版本。
      schema: { type: string, pattern: '^"?[0-9]+"?$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键。范围 = 账号 + 空间 + 动作 + key；同 key 不同请求体返回 409；结果默认保留 7 天。
      schema: { type: string, minLength: 8, maxLength: 128 }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: 可选幂等键，用于认证/会话等天然幂等或无法版本化的动作；服务端仍按账号+动作去重。
      schema: { type: string, minLength: 8, maxLength: 128 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 与当前会话绑定的 CSRF 令牌，取自 GET /auth/csrf（登录在登录前获取）；缺失或不匹配返回 403。
      schema: { type: string, minLength: 16, maxLength: 256 }
    q:
      name: q
      in: query
      required: false
      description: 关键词，长度 1～100，前后空白移除；% 与 _ 按字面量处理。空查询返回常用/最近，不做全表热度搜索。
      schema: { type: string, minLength: 1, maxLength: 100 }
    qRequired:
      name: q
      in: query
      required: true
      description: 搜索关键词，长度 1～100，前后空白移除；空串按 400 处理。
      schema: { type: string, minLength: 1, maxLength: 100 }
    type:
      name: type
      in: query
      required: false
      description: 知识类型筛选。
      schema: { $ref: '#/components/schemas/EntryType' }
    entityType:
      name: type
      in: query
      required: false
      description: 搜索或审计的实体类型筛选。
      schema:
        type: string
        enum: [entry, task, project, log, ledger]
    status:
      name: status
      in: query
      required: false
      description: 状态筛选。任务 todo|doing|done；知识 draft|verified|archived；成员 active|invited|removed；邀请 pending|accepted|revoked|expired。
      schema: { type: string, maxLength: 32 }
    tag:
      name: tag
      in: query
      required: false
      description: 标签名（按空间规范化名称匹配，≤32 字）。
      schema: { type: string, minLength: 1, maxLength: 32 }
    projectId:
      name: projectId
      in: query
      required: false
      description: 项目 ID 筛选；必须属于路径空间。
      schema: { $ref: '#/components/schemas/Uuid' }
    month:
      name: month
      in: query
      required: false
      description: 月份 YYYY-MM，按空间时区解释；缺省为当前月。
      schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
    from:
      name: from
      in: query
      required: false
      description: 起始业务日期（含），YYYY-MM-DD。
      schema: { $ref: '#/components/schemas/BusinessDate' }
    to:
      name: to
      in: query
      required: false
      description: 结束业务日期（含），YYYY-MM-DD；必须 ≥ from。
      schema: { $ref: '#/components/schemas/BusinessDate' }
    includeDeleted:
      name: includeDeleted
      in: query
      required: false
      description: 是否包含软删除记录，默认 false；仅 owner/editor 可置 true，普通列表与搜索默认排除。
      schema: { type: boolean, default: false }
    trashTypeQuery:
      name: type
      in: query
      required: false
      description: 回收站实体类型筛选。
      schema: { type: string, enum: [project, task, entry, log, ledger] }
  responses:
    BadRequest:
      description: 请求或查询语法错误（400），例如非法 JSON、非法日期格式、cursor 损坏。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 未登录、会话已过期或已被吊销（401）。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 已确认成员但角色无权，或 CSRF/来源校验失败（403）。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 对象不存在或不属于可访问空间（404）；不区分「不存在」与「无权」以避免探测。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 幂等键与请求体不一致、业务冲突或预览计划过期（409）。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PreconditionFailed:
      description: If-Match 版本过期（412）；响应体返回可授权查看的 currentVersion，客户端应刷新后重试。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: 请求体、正文或文件超过限制（413）；服务端明确说明上限，不截断内容。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnprocessableEntity:
      description: 字段或业务校验失败（422）；fieldErrors 给出字段级原因。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PreconditionRequired:
      description: 条件写入缺少 If-Match（428）。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: 登录、搜索或高成本接口限流（429）；按 Retry-After 退避。
      headers:
        Retry-After:
          description: 建议重试等待秒数。
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: 数据库或服务暂不可用（503）；写入结果未知时用幂等状态查询而不是新 key 重发。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUID；服务端生成，离线新建可接受经验证的客户端 UUID。
    UtcTimestamp:
      type: string
      format: date-time
      description: 服务器 UTC 时间，ISO8601 且带 Z 后缀。
    BusinessDate:
      type: string
      format: date
      description: 业务日期 YYYY-MM-DD，按空间时区解释，不是 UTC 时刻。
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    Version:
      type: integer
      minimum: 1
      description: 实体版本，从 1 递增；仅业务内容变化时递增（使用统计与 last_seen 不影响）。
    EntryType:
      type: string
      enum: [note, design, adr, troubleshoot, command]
      description: 知识类型（五种）。对应中文：note=笔记；design=方案/设计；adr=架构决策记录；troubleshoot=排障；command=命令片段。设计文档未给出英文枚举名，本草案暂定此组取值，需 F03 冻结确认。
    TaskPriority:
      type: string
      enum: [P0, P1, P2]
      description: 任务优先级。
    TaskStatus:
      type: string
      enum: [todo, doing, done]
      description: 任务状态；done 与 doneAt 一致，撤销完成清空 doneAt。
    EntryStatus:
      type: string
      enum: [draft, verified, archived]
      description: 知识状态。draft 可暂缺摘要；verified 必须标题、摘要、正文完整。
    MemberRole:
      type: string
      enum: [owner, editor, viewer]
      description: 成员角色。最后一位有效 owner 不可移除或降级。
    ProjectStage:
      type: string
      enum: [planning, developing, paused, done]
      description: 项目阶段（固定枚举）。设计文档未列出具体取值，本草案暂定 planning/developing/paused/done，需 F03 冻结确认。
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, description: '字段路径，例如 title 或 tags[2]' }
        code: { type: string, description: '稳定字段错误码，例如 REQUIRED、MAX_LENGTH、INVALID_ENUM' }
        message: { type: string, description: '可直接展示的中文说明' }
    PageMeta:
      type: object
      description: 游标分页元信息。
      required: [hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
          description: 下一页游标；hasMore=false 时为 null。
        hasMore: { type: boolean }
    SuccessEnvelope:
      type: object
      description: 统一成功响应基座；具体 data 类型由各端点 allOf 细化。
      required: [data, requestId]
      properties:
        data: {}
        meta: { $ref: '#/components/schemas/PageMeta' }
        requestId: { type: string, description: '请求关联 ID，同时出现在响应头与日志中' }
    ErrorResponse:
      type: object
      description: 统一失败响应；所有 4xx/5xx 都使用该结构（含 403 CSRF、412、428、429、503）。
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 稳定业务错误码，例如 VALIDATION_FAILED、VERSION_CONFLICT、PLAN_STALE、LAST_OWNER、RATE_LIMITED。
            message: { type: string, description: '可展示的中文说明，不含堆栈、SQL、内部路径或哈希' }
            fieldErrors:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
            currentVersion:
              type: integer
              minimum: 1
              description: 仅 412/409 场景：可授权查看的当前 version（用于刷新后重试）。
            details:
              type: object
              additionalProperties: true
              description: 附加结构化信息（如 planHash、jobId、conflict 字段名），不得含敏感数据。
        requestId: { type: string }
    User:
      type: object
      description: 账号。绝不返回 password_hash、会话 token、内部路径。账号不通过本 API 编辑资料，故无 version。
      required: [id, email, displayName, status, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email, description: '规范化邮箱（只读）' }
        displayName: { type: string, minLength: 1, maxLength: 50 }
        status: { type: string, enum: [active, disabled] }
        passwordChangedAt: { $ref: '#/components/schemas/UtcTimestamp' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    Workspace:
      type: object
      description: 空间。新用户创建个人默认空间；团队共享数据归空间。
      required: [id, name, timezone, status, version, createdBy, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string, description: 'IANA 时区，默认 Asia/Shanghai；仅 Owner 可改且需确认对日期统计的影响' }
        status: { type: string, enum: [active, archived] }
        version: { $ref: '#/components/schemas/Version' }
        createdBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    WorkspaceMember:
      type: object
      description: 成员关系。数据库以 (workspace_id,user_id) 唯一标识、无独立主键；本草案用 userId 作为 id 便于前端列表 key。
      required: [id, workspaceId, userId, role, status, joinedAt, version, createdAt, updatedAt]
      properties:
        id: { type: string, description: '成员关系无独立主键，取 userId 作为 id' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/MemberRole' }
        status: { type: string, enum: [active, invited, removed] }
        joinedAt: { $ref: '#/components/schemas/UtcTimestamp' }
        version: { $ref: '#/components/schemas/Version' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp', description: '记录创建时间（与 joinedAt 同源）' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
        user: { $ref: '#/components/schemas/User' }
    Invitation:
      type: object
      description: 空间邀请。token 仅创建响应出现一次，列表不返回。邀请表无 version，撤销以原子标记实现。
      required: [id, workspaceId, email, role, status, expiresAt, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/MemberRole' }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { $ref: '#/components/schemas/UtcTimestamp', description: '默认签发后 48 小时' }
        acceptedAt: { $ref: '#/components/schemas/UtcTimestamp' }
        revokedAt: { $ref: '#/components/schemas/UtcTimestamp' }
        invitedBy: { $ref: '#/components/schemas/Uuid' }
        oneTimeLink:
          type: string
          format: uri
          writeOnly: true
          description: 一次性邀请链接，仅在创建响应中返回；列表与详情不返回。
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    Session:
      type: object
      description: 会话。不返回 token 或 token 哈希。
      required: [id, createdAt, lastSeenAt, idleExpiresAt, absoluteExpiresAt, current]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        lastSeenAt: { $ref: '#/components/schemas/UtcTimestamp' }
        idleExpiresAt: { $ref: '#/components/schemas/UtcTimestamp' }
        absoluteExpiresAt: { $ref: '#/components/schemas/UtcTimestamp' }
        current: { type: boolean, description: '是否为当前请求所用会话' }
        ipAddress: { type: string, description: '脱敏后的来源地址（可省略）' }
        userAgent: { type: string, maxLength: 300 }
    MembershipSummary:
      type: object
      description: 用于登录/me 的空间摘要。
      required: [workspaceId, name, role, timezone]
      properties:
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        role: { $ref: '#/components/schemas/MemberRole' }
        timezone: { type: string }
    MeProfile:
      type: object
      required: [user, memberships]
      properties:
        user: { $ref: '#/components/schemas/User' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
        preferences: { $ref: '#/components/schemas/Preference' }
    Project:
      type: object
      description: 项目。进度不保存自动冗余真值：progressManual=true 返回 manualProgress，否则按有效任务 done/总数四舍五入，无任务为 0。
      required: [id, workspaceId, name, stage, progressManual, progress, version, lastActivityAt, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 100 }
        repo: { type: string, maxLength: 500, description: '仓库地址，仅 http/https' }
        stack:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 50 }
        stage: { $ref: '#/components/schemas/ProjectStage' }
        nextStep: { type: string, maxLength: 300, description: '单行文本' }
        progressManual: { type: boolean, description: '是否使用手动进度' }
        manualProgress: { type: [integer, 'null'], minimum: 0, maximum: 100, description: '手动进度 0～100；0 有效' }
        progress: { type: integer, minimum: 0, maximum: 100, description: '只读计算结果' }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', description: '白名单色值' }
        lastActivityAt: { $ref: '#/components/schemas/UtcTimestamp', description: '项目或关联任务/条目/台账内容变化时更新；复制计数与浏览不更新' }
        version: { $ref: '#/components/schemas/Version' }
        createdBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
        originMetadata: { type: object, additionalProperties: true, description: '旧数据来源标识与来源时间；不作为在线授权或冲突依据' }
    ProjectOverview:
      type: object
      description: 项目详情三块聚合，每块带独立分页 meta 与列表入口。
      required: [project, progress, counts]
      properties:
        project: { $ref: '#/components/schemas/Project' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        counts:
          type: object
          properties:
            tasksTotal: { type: integer }
            tasksTodo: { type: integer }
            tasksDoing: { type: integer }
            tasksDone: { type: integer }
            entriesTotal: { type: integer }
            ledgerRecords: { type: integer }
            ledgerMinutes: { type: integer }
            savedMinutes: { type: integer }
        tasks:
          type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Task' } }
            meta: { $ref: '#/components/schemas/PageMeta' }
        entries:
          type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Entry' } }
            meta: { $ref: '#/components/schemas/PageMeta' }
        ledger:
          type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/LedgerRecord' } }
            meta: { $ref: '#/components/schemas/PageMeta' }
    Task:
      type: object
      description: 任务。done 与 doneAt 由服务端一致维护；链接仅 http/https。
      required: [id, workspaceId, title, priority, status, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 200 }
        projectId: { type: [string, 'null'], format: uuid, description: '所属项目；必须同空间有效' }
        projectName: { type: [string, 'null'], description: '冗余展示名，只读' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        dueDate: { type: [string, 'null'], format: date, description: '截止业务日期 YYYY-MM-DD，按空间时区解释' }
        aiContext: { type: string, maxLength: 2000 }
        blocker: { type: string, maxLength: 1000 }
        doneAt: { type: [string, 'null'], format: date-time, description: '完成时间 UTC；仅 status=done 时非空' }
        version: { $ref: '#/components/schemas/Version' }
        createdBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    DevelopmentLog:
      type: object
      required: [id, workspaceId, logDate, text, authorId, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        logDate: { $ref: '#/components/schemas/BusinessDate' }
        text: { type: string, minLength: 1, maxLength: 4000 }
        authorId: { $ref: '#/components/schemas/Uuid' }
        authorName: { type: string, description: '冗余展示名，只读' }
        version: { $ref: '#/components/schemas/Version' }
        createdBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    Tag:
      type: object
      required: [id, workspaceId, name, nameNormalized, displayName, entryCount, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 32, description: '展示用名称' }
        nameNormalized: { type: string, maxLength: 32, description: '同空间唯一' }
        displayName: { type: string, maxLength: 32 }
        entryCount: { type: integer, minimum: 0, description: '有效条目计数' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    Entry:
      type: object
      description: 知识条目。body ≤ 20480 UTF-8 字节；verified 必须标题、摘要、正文完整；draft 可暂缺摘要。
      required: [id, workspaceId, type, title, body, status, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/EntryType' }
        title: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: [string, 'null'], maxLength: 300, description: 'draft 可为空；verified 必填' }
        body: { type: string, description: 'Markdown 原文，octet_length ≤ 20480' }
        bodyBytes: { type: integer, minimum: 0, description: '只读字节数，便于前端提示 20KB 上限' }
        lang: { type: string, maxLength: 32 }
        projectId: { type: [string, 'null'], format: uuid }
        source: { type: string, maxLength: 32, description: '来源标识，例如 web、offline、import、promote' }
        status: { $ref: '#/components/schemas/EntryStatus' }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        tags:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Tag' }
        usageCount: { type: integer, minimum: 0, description: '复制使用次数，与正文 version 分离' }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        version: { $ref: '#/components/schemas/Version' }
        createdBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    EntryRevision:
      type: object
      description: 正文修订，仅保留最近 5 条；不可变，createdAt/updatedAt 等于 savedAt。
      required: [id, workspaceId, entryId, body, savedAt, savedBy, sourceVersion, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        entryId: { $ref: '#/components/schemas/Uuid' }
        body: { type: string }
        savedAt: { $ref: '#/components/schemas/UtcTimestamp' }
        savedBy: { $ref: '#/components/schemas/Uuid' }
        sourceVersion: { type: integer, minimum: 1, description: '被替换正文当时的条目 version' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp', description: '等于 savedAt' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp', description: '等于 savedAt' }
    EntryUsage:
      type: object
      description: 使用统计，与正文 version 分离；复制事件幂等。
      required: [id, workspaceId, entryId, useCount, createdAt, updatedAt]
      properties:
        id: { type: string, description: '每个条目唯一，取 entryId' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        entryId: { $ref: '#/components/schemas/Uuid' }
        useCount: { type: integer, minimum: 0 }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    LedgerRecord:
      type: object
      description: AI 使用台账。minutes>0、savedMinutes≥0、effect 为 1～5 整数。
      required: [id, workspaceId, recordDate, tool, scene, minutes, savedMinutes, effect, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        recordDate: { $ref: '#/components/schemas/BusinessDate' }
        projectId: { type: [string, 'null'], format: uuid }
        tool: { type: string, minLength: 1, maxLength: 100 }
        scene: { type: string, minLength: 1, maxLength: 100 }
        minutes: { type: integer, minimum: 1, maximum: 1440 }
        savedMinutes: { type: integer, minimum: 0, maximum: 1440 }
        effect: { type: integer, minimum: 1, maximum: 5, description: '效果评分 1～5 整数' }
        note: { type: [string, 'null'], maxLength: 4000 }
        entryId: { type: [string, 'null'], format: uuid, description: '关联知识；必须同空间有效' }
        version: { $ref: '#/components/schemas/Version' }
        createdBy: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    TodayDashboard:
      type: object
      description: 服务端按空间时区计算的今日聚合。紧急项阈值：逾期>0 天、doing 停滞>3 天、draft 创建>7 天；草稿不计入任务总数。
      required: [businessDate, timezone, overdue, stalled, staleDraft, counts, generatedAt]
      properties:
        businessDate: { $ref: '#/components/schemas/BusinessDate' }
        timezone: { type: string }
        overdue:
          type: array
          description: 逾期任务（dueDate < businessDate 且未完成）
          items: { $ref: '#/components/schemas/Task' }
        stalled:
          type: array
          description: doing 停滞超过 3 天的任务
          items: { $ref: '#/components/schemas/Task' }
        staleDraft:
          type: array
          description: 创建超过 7 天仍为 draft 的知识
          items: { $ref: '#/components/schemas/Entry' }
        counts:
          type: object
          required: [overdueCount, stalledCount, staleDraftCount, tasksTotal, tasksTodo, tasksDoing, tasksDone]
          properties:
            overdueCount: { type: integer, minimum: 0 }
            stalledCount: { type: integer, minimum: 0 }
            staleDraftCount: { type: integer, minimum: 0 }
            tasksTotal: { type: integer, minimum: 0 }
            tasksTodo: { type: integer, minimum: 0 }
            tasksDoing: { type: integer, minimum: 0 }
            tasksDone: { type: integer, minimum: 0 }
            entriesDraft: { type: integer, minimum: 0 }
            entriesTotal: { type: integer, minimum: 0 }
        generatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    MonthlyAnalytics:
      type: object
      description: 月度统计。avgEffect 为 1～5 评分均值，无记录时为 0（不出 NaN）；totalSavedMinutes 为节省分钟合计。
      required: [month, totalRecords, totalMinutes, totalSavedMinutes, avgEffect, byScene, generatedAt]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        totalRecords: { type: integer, minimum: 0 }
        totalMinutes: { type: integer, minimum: 0 }
        totalSavedMinutes: { type: integer, minimum: 0 }
        avgEffect: { type: number, minimum: 0, maximum: 5, description: '无记录时 0，不用 NaN 或误导性折线' }
        byScene:
          type: array
          items:
            type: object
            required: [scene, recordCount, minutes, savedMinutes, avgEffect]
            properties:
              scene: { type: string }
              recordCount: { type: integer, minimum: 0 }
              minutes: { type: integer, minimum: 0 }
              savedMinutes: { type: integer, minimum: 0 }
              avgEffect: { type: number, minimum: 0, maximum: 5 }
        generatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    WeeklyAnalytics:
      type: object
      description: 近 8 周趋势，周一为周起点，缺周补 0。
      required: [from, to, weeks, generatedAt]
      properties:
        from: { $ref: '#/components/schemas/BusinessDate' }
        to: { $ref: '#/components/schemas/BusinessDate' }
        weeks:
          type: array
          minItems: 8
          maxItems: 8
          items:
            type: object
            required: [weekStart, weekEnd, minutes, savedMinutes, avgEffect, recordCount]
            properties:
              weekStart: { $ref: '#/components/schemas/BusinessDate' }
              weekEnd: { $ref: '#/components/schemas/BusinessDate' }
              minutes: { type: integer, minimum: 0 }
              savedMinutes: { type: integer, minimum: 0 }
              avgEffect: { type: number, minimum: 0, maximum: 5 }
              recordCount: { type: integer, minimum: 0 }
        generatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    SearchHit:
      type: object
      required: [entityType, id, title, matchedFields, score]
      properties:
        entityType: { type: string, enum: [entry, task, project, log, ledger] }
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        snippet: { type: string, description: '命中片段，最多 200 字' }
        matchedFields:
          type: array
          description: 命中字段，用于前端高亮
          items: { type: string, enum: [title, tag, summary, body, other] }
        score: { type: number, description: '相关性分数，仅用于排序，不作为稳定契约值' }
        status: { type: [string, 'null'] }
        type: { type: [string, 'null'] }
        projectId: { type: [string, 'null'], format: uuid }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    SearchResult:
      type: object
      description: 搜索结果，按实体分组并标注命中字段；排序为标题匹配、标签、摘要正文，再近期使用/次数，最后 updated_at 与 id。
      required: [query, total, groups]
      properties:
        query: { type: string }
        total: { type: integer, minimum: 0 }
        groups:
          type: array
          items:
            type: object
            required: [entityType, count, items]
            properties:
              entityType: { type: string, enum: [entry, task, project, log, ledger] }
              count: { type: integer, minimum: 0 }
              items:
                type: array
                items: { $ref: '#/components/schemas/SearchHit' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    ImportCounts:
      type: object
      description: 导入预览/结果计数。
      required: [create, update, skip, conflict, reject]
      properties:
        create: { type: integer, minimum: 0 }
        update: { type: integer, minimum: 0 }
        skip: { type: integer, minimum: 0 }
        conflict: { type: integer, minimum: 0 }
        reject: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    ImportPreview:
      type: object
      description: 导入预览。validating 只写暂存与 job，不改业务表；默认 24 小时内确认。
      required: [jobId, state, planHash, expiresAt, counts, generatedAt]
      properties:
        jobId: { $ref: '#/components/schemas/Uuid' }
        state: { type: string, enum: [uploaded, validating, preview_ready, queued, running, succeeded, failed, cancelled, expired] }
        planHash: { type: string, description: '计划指纹，提交时必须回传' }
        sourceNamespace: { type: string }
        expiresAt: { $ref: '#/components/schemas/UtcTimestamp', description: '默认预览后 24 小时' }
        counts: { $ref: '#/components/schemas/ImportCounts' }
        conflicts:
          type: array
          items:
            type: object
            properties:
              entityType: { type: string, enum: [project, task, entry, log, ledger] }
              sourceId: { type: string }
              entityId: { type: [string, 'null'], format: uuid }
              serverVersion: { type: integer }
              sourceUpdatedAt: { type: [string, 'null'], format: date-time }
              reason: { type: string }
              defaultResolution: { type: string, enum: [keep_server, apply_import] }
        rejects:
          type: array
          items:
            type: object
            properties:
              entityType: { type: string }
              sourceId: { type: string }
              reason: { type: string }
              fieldErrors:
                type: array
                items: { $ref: '#/components/schemas/FieldError' }
        baseVersions:
          type: object
          additionalProperties: { type: integer }
          description: 触及实体的版本快照，提交时重新校验
        generatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    TransferJob:
      type: object
      description: 传输作业。状态机 uploaded→validating→preview_ready→queued→running→succeeded/failed/cancelled/expired；取消仅在业务提交前生效。
      required: [id, workspaceId, type, state, counts, attempts, createdAt, updatedAt, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, enum: [export, import] }
        state:
          type: string
          enum: [uploaded, validating, preview_ready, queued, running, succeeded, failed, cancelled, expired]
        counts: { $ref: '#/components/schemas/ImportCounts' }
        progress:
          type: object
          properties:
            processed: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        fileHash: { type: string }
        fileSize: { type: integer, minimum: 0 }
        planHash: { type: [string, 'null'] }
        sourceNamespace: { type: [string, 'null'] }
        baseVersions:
          type: object
          additionalProperties: { type: integer }
        attempts: { type: integer, minimum: 0, description: '最多 3 次可重试基础故障' }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        expiresAt: { $ref: '#/components/schemas/UtcTimestamp', description: '结果、下载文件与暂存默认 24 小时清理' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
        preview: { $ref: '#/components/schemas/ImportPreview' }
    TrashItem:
      type: object
      description: 回收站条目。30 天保留期内可恢复；恢复不自动复活已删除父对象。
      required: [id, workspaceId, type, entityId, title, deletedAt, expiresAt, version, restorable, createdAt, updatedAt]
      properties:
        id: { type: string, description: '取实体 id（同空间同类唯一）' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, enum: [project, task, entry, log, ledger] }
        entityId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        deletedAt: { $ref: '#/components/schemas/UtcTimestamp' }
        deletedBy: { $ref: '#/components/schemas/Uuid' }
        expiresAt: { $ref: '#/components/schemas/UtcTimestamp', description: 'deletedAt + 30 天，到期由有审计的后台任务清理' }
        version: { $ref: '#/components/schemas/Version', description: '删除前最后版本，用于恢复/硬删的 If-Match' }
        restorable: { type: boolean }
        blockedReasons:
          type: array
          items: { type: string }
          description: 不可恢复原因，例如父项目已删除
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    AuditEvent:
      type: object
      description: 空间审计事件。脱敏，不存密码/token/整篇正文。
      required: [id, actorId, action, result, at, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }

        defaultWorkspaceId: { type: [string, 'null'], format: uuid }
        version: { $ref: '#/components/schemas/Version' }
        createdAt: { $ref: '#/components/schemas/UtcTimestamp' }
        updatedAt: { $ref: '#/components/schemas/UtcTimestamp' }
    WorkspacePreference:

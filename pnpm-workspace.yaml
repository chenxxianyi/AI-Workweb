packages:
  - "apps/*"
  - "packages/*"
  - "database"
allowBuilds:
  # prisma CLI 与引擎需要在安装期下载/校验查询引擎（F05）
  '@prisma/engines': true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.105.3'
  - '@tanstack/react-query@5.105.3'
  - '@vitejs/plugin-react@6.2.1'
  - '@vitest/mocker@5.1.0'
  - '@vitest/spy@5.1.0'
  - vitest@5.1.0

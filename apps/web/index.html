<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>AI 编程工作台</title>
    <!-- 首屏前应用主题，避免闪白（ADR-0007）；与 ThemeProvider 读取同一个 localStorage 键 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('aiwb.theme');
          var system = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = stored === 'dark' || stored === 'light' ? stored : system ? 'dark' : 'light';
          document.documentElement.dataset.theme = resolved;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
